<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>MochiBoo</title>
<meta name="description" content="Your little world, made with love.">
<meta name="theme-color" content="#FFF4F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MochiBoo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app"><div style="min-height:80vh;display:grid;place-items:center;font-family:Fredoka,sans-serif;font-size:22px;color:#FF5C8A">🫧</div></main>
<div id="installHint" class="hidden"></div>
<script type="module" src="js/app.js"></script>
<script>
  // Gentle nudge to install on iPhone when opened in Safari (not yet on home screen)
  (function () {
    var standalone = window.navigator.standalone || matchMedia('(display-mode: standalone)').matches;
    var ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    if (!standalone && ios && !localStorage.getItem('mb_hint_dismissed')) {
      var h = document.getElementById('installHint');
      h.className = '';
      h.innerHTML = '<div style="position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 96px);background:#5A1F33;color:#FFF4F7;border-radius:22px;padding:14px 16px;z-index:60;font-family:Nunito,sans-serif;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.25)">' +
        '💗 Keep MochiBoo forever: tap <b>Share</b> <span style="font-size:18px">⬆️</span> then <b>Add to Home Screen</b>.' +
        '<button style="float:right;background:none;border:0;color:inherit;font-size:18px" aria-label="Dismiss" onclick="localStorage.setItem(\'mb_hint_dismissed\',1);this.parentNode.remove()">✕</button></div>';
    }
  })();
</script>
</body>
</html>
